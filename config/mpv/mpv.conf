# ==============================================================================
# mpv Configuration Optimized for Lossless Scaling Frame Generation (lsfg-vk)
# Location: ~/.config/mpv/mpv.conf
# ==============================================================================

# ===== YouTube & Network Streaming Defaults =====
ytdl=yes
ytdl-format=bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=1080]+bestaudio/best
cache=yes
cache-secs=120
demuxer-max-bytes=250MiB
demuxer-max-back-bytes=100MiB

# ===== Persistence =====
save-position-on-quit=yes
keep-open=always
audio-pitch-correction=yes

# ===== Default Video Output =====
# vo=gpu-next is recommended for Vulkan modern rendering pipelines
vo=gpu-next
gpu-api=vulkan

# Hardware acceleration with system RAM copy-back
# (nvdec-copy for NVIDIA, vaapi-copy for AMD/Intel)
hwdec=nvdec-copy
hwdec-codecs=all

# ===== Profile: LSFG (Lossless Scaling Frame Generation) =====
# Applied automatically when running with the `lsfg` launcher
# or via: mpv --profile=lsfg video.mkv
[lsfg]
vo=gpu-next
gpu-api=vulkan
hwdec=nvdec-copy
hwdec-codecs=all
interpolation=no
video-sync=audio
