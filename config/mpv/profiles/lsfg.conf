# ==============================================================================
# Standalone mpv Profile for lsfg-vk
# Can be included in your existing ~/.config/mpv/mpv.conf via:
# include=~~/profiles/lsfg.conf
# ==============================================================================

[lsfg]
vo=gpu-next
gpu-api=vulkan
hwdec=nvdec-copy
hwdec-codecs=all
interpolation=no
video-sync=audio
